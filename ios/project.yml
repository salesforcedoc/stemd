name: StemdiOS
options:
  bundleIdPrefix: dev.stemd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # The Xcode whose recommended settings this project already follows, so it
  # does not offer to update them on every open.
  xcodeVersion: "26.4"

# Shared build settings. The real Apple Developer Team ID is not committed:
# Config/Base.xcconfig includes the gitignored Config/Local.xcconfig, which
# sets STEMD_DEVELOPMENT_TEAM. Until a developer creates that file, the
# placeholder in Base.xcconfig is used, which builds for the simulator and
# fails device signing.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Resolved from Config/Base.xcconfig at build time.
    DEVELOPMENT_TEAM: $(STEMD_DEVELOPMENT_TEAM)
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  StemdiOS:
    type: application
    platform: iOS
    # The target is named StemdiOS but the bundle is stemd.app, so say so
    # explicitly: xcodegen otherwise names the product after the target and
    # the scheme then points at the wrong app.
    productName: stemd
    sources:
      - path: StemdiOS
    settings:
      base:
        PRODUCT_NAME: stemd
        PRODUCT_BUNDLE_IDENTIFIER: dev.phasimstemd.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: StemdiOS/StemdiOS-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Rust archive differs per SDK: the simulator is a different target
        # triple, not a different slice of one archive. The frameworks are the
        # ones MLX links PRIVATE and a static archive cannot record.
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - -L$(SRCROOT)/../target/aarch64-apple-ios/release
          - -lstemd_ios
          - -lc++
          - -framework
          - Metal
          - -framework
          - Foundation
          - -framework
          - Accelerate
          - -framework
          - QuartzCore
          - -framework
          - Security
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - -L$(SRCROOT)/../target/aarch64-apple-ios-sim/release
          - -lstemd_ios
          - -lc++
          - -framework
          - Metal
          - -framework
          - Foundation
          - -framework
          - Accelerate
          - -framework
          - QuartzCore
          - -framework
          - Security
    info:
      path: StemdiOS/Info.plist
      properties:
        CFBundleDisplayName: stemd
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        # Lets LaunchServices hand the iOS binary to the "Designed for iPad"
        # runtime when it runs on Apple-silicon macOS.
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: "stemd serves separated stems to other devices on your network."
        # The CDJ sidecar's AUTO discovery browses this. Bonjour is allowed
        # without the restricted multicast entitlement; it needs this list and
        # the local-network permission.
        NSBonjourServices:
          - _stemd._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
    preBuildScripts:
      - name: Build stemd Rust library
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          # Xcode's script phases do not inherit the login shell's PATH, so
          # cargo (a rustup shim in ~/.cargo/bin) is otherwise not found.
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            RUST_TARGET=aarch64-apple-ios-sim
          else
            RUST_TARGET=aarch64-apple-ios
          fi
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            cargo build --release -p stemd-ios --target "$RUST_TARGET"
    postBuildScripts:
      - name: Copy MLX Metal kernels
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            RUST_TARGET=aarch64-apple-ios-sim
          else
            RUST_TARGET=aarch64-apple-ios
          fi
          METAL=$(find "$SRCROOT/../target/$RUST_TARGET/release/build" \
            -path '*/out/build/lib/mlx.metallib' -print -quit)
          if [ -z "$METAL" ]; then
            echo "error: mlx.metallib not found; did the Rust build run?" >&2
            exit 1
          fi
          cp "$METAL" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/mlx.metallib"

schemes:
  StemdiOS:
    build:
      targets:
        StemdiOS: all
    run:
      config: Debug
    archive:
      config: Release
